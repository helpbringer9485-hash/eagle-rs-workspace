name: Build unsigned Windows application
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Compile native helper
        shell: pwsh
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:exe /reference:System.Web.Extensions.dll /out:SignalDock.exe SignalDock.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run check
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: eagle-rs-unsigned-experimental
          path: |
            dist/*Setup*.exe
            dist/*.blockmap
          if-no-files-found: error
